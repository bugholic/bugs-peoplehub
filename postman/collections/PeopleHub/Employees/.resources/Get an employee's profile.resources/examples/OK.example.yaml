        "email": "string",
        "phone": "string",
        "photoUrl": "string",
        "joinDate": "1980-10-16",
        "status": "INACTIVE",
        "department": {
          "id": "string",
          "name": "string"
        },
        "designation": {
          "id": "string",
          "name": "string"
        },
        "location": {
          "id": "string",
          "name": "string"
        },
        "reportingManagerId": "string"
      }
order: 1000
