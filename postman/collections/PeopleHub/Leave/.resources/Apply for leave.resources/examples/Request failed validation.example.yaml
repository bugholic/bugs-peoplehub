$kind: http-example
request:
  url: "{{baseUrl}}/api/leave/requests"
  method: POST
  headers:
    - key: ph_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "leaveTypeId": "string",
        "fromDate": "2012-10-29",
        "toDate": "2025-04-23",
        "reason": "string",
        "dayPart": "FULL"
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "error": {
          "code": "string",
          "message": "string",
          "details": [
            {
              "path": "string",
              "message": "string"
            },
            {
              "path": "string",
              "message": "string"
            }
          ]
        }
      }
order: 4000
