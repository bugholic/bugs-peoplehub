$kind: http-example
request:
  url: "{{baseUrl}}/api/attendance/regularizations"
  method: POST
  headers:
    - key: ph_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "date": "2002-01-23",
        "checkIn": "05:21",
        "checkOut": "20:46",
        "reason": "string"
      }
response:
  statusCode: 409
  statusText: Conflict
  headers:
    Content-Type: text/plain
  body:
    type: text
    content: ""
order: 3000
