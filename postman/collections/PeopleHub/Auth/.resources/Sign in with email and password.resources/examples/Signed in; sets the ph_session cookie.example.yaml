$kind: http-example
request:
  url: "{{baseUrl}}/api/auth/login"
  method: POST
  headers:
    - key: ph_session
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
    - key: Accept
      value: application/json
  body:
    type: json
    content: |-
      {
        "email": "Wej-uUOue@WIgjkFfRVkwvCUSqj.nsn",
        "password": "string"
      }
response:
  statusCode: 200
  statusText: OK
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "session": {
          "userId": "string",
          "employeeId": "string",
          "role": "ADMIN",
          "name": "string"
        }
      }
order: 1000
