openapi: 3.0.3
info:
  title: PeopleHub API
  description: Employee directory, leave and attendance for PeopleHub.
  version: "1.0.0"
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Employees
  - name: Leave
  - name: Attendance
  - name: Roles
  - name: Notifications
  - name: Jobs

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ph_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
      required: [error]
    Session:
      type: object
      properties:
        userId: { type: string }
        employeeId: { type: string }
        organizationId: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE], description: "Clerk org role. ADMIN always holds every permission." }
        name: { type: string }
        accessRole:
          type: object
          nullable: true
          description: Custom role assigned to this employee; null = permissions follow `role`.
          properties:
            id: { type: string }
            name: { type: string }
        permissions:
          type: array
          description: Effective permissions for this request.
          items: { $ref: "#/components/schemas/Permission" }
    Permission:
      type: string
      enum: [employees.view_inactive, employees.create, employees.edit, employees.view_sensitive, employees.edit_sensitive, employees.deactivate, leave.approve_team, leave.approve_all, leave.manage_types, leave.adjust_balances, holidays.manage, attendance.approve_team, attendance.approve_all, attendance.remote_approve, attendance.report_team, attendance.report_all, attendance.manage_locations, attendance.manage_shifts, attendance.edit, org.structure, org.members]
    AccessRole:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
        memberCount: { type: integer, description: Active employees holding this role }
        updatedAt: { type: string, format: date-time }
    AccessRoleInput:
      type: object
      required: [name, permissions]
      properties:
        name: { type: string, maxLength: 60 }
        description: { type: string, nullable: true, maxLength: 200 }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/Permission" }
    Lookup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    EmployeeSummary:
      type: object
      properties:
        id: { type: string }
        empCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        joinDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        department: { $ref: "#/components/schemas/Lookup" }
        designation: { $ref: "#/components/schemas/Lookup" }
        location: { $ref: "#/components/schemas/Lookup" }
        shift:
          type: object
          nullable: true
          description: "Assigned shift (detail endpoint only); null = the organization default"
          properties:
            id: { type: string }
            name: { type: string }
            startTime: { type: string, example: "09:00" }
            endTime: { type: string, example: "18:00" }
        reportingManagerId: { type: string, nullable: true }
    EmployeeCreate:
      type: object
      required: [empCode, firstName, lastName, email, joinDate]
      properties:
        empCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        joinDate: { type: string, format: date }
        departmentId: { type: string, nullable: true }
        designationId: { type: string, nullable: true }
        locationId: { type: string, nullable: true }
        shiftId: { type: string, nullable: true, description: "null = the organization default shift" }
        reportingManagerId: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE], default: EMPLOYEE }
        password: { type: string, minLength: 8, description: "Set to create a login for this employee" }
    LeaveBalance:
      type: object
      properties:
        leaveTypeId: { type: string }
        code: { type: string }
        name: { type: string }
        paid: { type: boolean }
        unlimited: { type: boolean, description: "Unpaid types (e.g. Loss of Pay) aren't limited by a balance; usage is still tracked." }
        annualGrant: { type: number, description: "This year's grant, prorated by join date in the join year." }
        carriedForward: { type: number, description: "Unused days carried in from earlier years (carry-forward types only)." }
        granted: { type: number, description: "Total entitlement for the year: annualGrant + carriedForward." }
        used: { type: number }
        pending: { type: number }
        available: { type: number }
    Notification:
      type: object
      properties:
        id: { type: string }
        type:
          type: string
          enum: [LEAVE_SUBMITTED, LEAVE_APPROVED, LEAVE_REJECTED, LEAVE_CANCELLED, REGULARIZATION_SUBMITTED, REGULARIZATION_APPROVED, REGULARIZATION_REJECTED, REMOTE_SUBMITTED, REMOTE_APPROVED, REMOTE_REJECTED, BALANCE_ADJUSTED, APPROVALS_PENDING, APPROVAL_ASSIGNED, ATTENDANCE_AUTO_CLOSED, ATTENDANCE_MISSING, ATTENDANCE_EDITED, LEAVE_REVOKED]
        title: { type: string }
        body: { type: string, nullable: true }
        link: { type: string, nullable: true, description: "App path to open" }
        read: { type: boolean }
        createdAt: { type: string, format: date-time }
        actor:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
            photoUrl: { type: string, nullable: true }
    LeaveBalanceAdjustment:
      type: object
      properties:
        id: { type: string }
        employeeId: { type: string }
        leaveType: { $ref: "#/components/schemas/Lookup" }
        year: { type: integer }
        days: { type: number, description: "Signed change to the year's grant" }
        kind: { type: string, enum: [MANUAL, QUOTA_CHANGE] }
        reason: { type: string }
        createdBy:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        createdAt: { type: string, format: date-time }
    LeaveRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        leaveType: { $ref: "#/components/schemas/Lookup" }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        groupId: { type: string, nullable: true, description: "Shared by the parts of a combined leave; they are approved, rejected and cancelled together" }
        dayPart: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF] }
        days: { type: number }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AttendanceDay:
      type: object
      properties:
        date: { type: string, format: date }
        status:
          type: string
          enum: [PRESENT, HALF_DAY, ABSENT, LEAVE, HALF_DAY_LEAVE, HOLIDAY, WEEKEND, UPCOMING]
          description: "Under a shift, a finished working day below the full-day minimum is HALF_DAY, below the half-day minimum ABSENT"
        checkIn: { type: string, format: date-time, nullable: true, description: "First check-in of the day" }
        checkOut: { type: string, format: date-time, nullable: true, description: "Last check-out of the day; null while a session is open" }
        workedMinutes: { type: integer, description: "Total of the day's closed sessions" }
        lateMinutes: { type: integer, description: "Minutes after the shift start of the first check-in, once past the grace; 0 without a shift" }
        earlyExitMinutes: { type: integer, description: "Minutes before the shift end of the last check-out, once past the grace; set when no session is open" }
        overtimeMinutes: { type: integer, description: "Worked minutes beyond the shift length (all worked time on a weekend or holiday)" }
        regularized: { type: boolean }
        autoClosed: { type: boolean, description: "A session left open was closed by the daily job (at the shift end for office sessions, else at check-in with no time)" }
        edited: { type: boolean, description: "Set directly by an administrator (edit or CSV import); see /api/attendance/edits" }
        leaveType: { type: string, nullable: true }
        workMode: { $ref: "#/components/schemas/DayWorkMode" }
        remoteStatus: { type: string, enum: [PENDING, APPROVED, REJECTED], nullable: true, description: "Status of the day's remote work request, if any" }
        openSince: { type: string, format: date-time, nullable: true, description: "Start of the open session, when checked in right now" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceSession" }
    DayWorkMode:
      type: string
      enum: [OFFICE, REMOTE, HYBRID]
      nullable: true
      description: "OFFICE or REMOTE when every session of the day was; HYBRID when they differ"
    AttendanceSession:
      type: object
      description: One check-in to check-out stretch. A day can have several.
      properties:
        id: { type: string }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time, nullable: true, description: "null while the session is open" }
        workMode: { type: string, enum: [OFFICE, REMOTE], nullable: true, description: "Decided at check-in from the office geofences" }
        office:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
    PunchLocation:
      type: object
      description: The device's position when punching. Omit it (or send no body) if location is unavailable; the day is then logged as remote.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, description: "Reported accuracy radius in metres" }
    AttendanceLog:
      type: object
      properties:
        autoClosed: { type: boolean, description: "Closed by the daily job, not the employee" }
        edited: { type: boolean, description: "Set directly by an administrator" }
        id: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time, nullable: true, description: "First check-in of the day" }
        checkOut: { type: string, format: date-time, nullable: true, description: "Last check-out of the day; null while a session is open" }
        workedMinutes: { type: integer, description: "Total of the day's closed sessions" }
        workMode: { $ref: "#/components/schemas/DayWorkMode" }
        lateMinutes: { type: integer, description: "Minutes after the shift start of the first check-in, once past the grace; 0 without a shift" }
        earlyExitMinutes: { type: integer, description: "Minutes before the shift end of the last check-out, once past the grace; set when no session is open" }
        overtimeMinutes: { type: integer, description: "Worked minutes beyond the shift length (all worked time on a weekend or holiday)" }
        credit: { type: string, enum: [FULL, HALF, SHORT], nullable: true, description: "Day credit under the shift; null without a shift, on off days, or while a session is open" }
        openSince: { type: string, format: date-time, nullable: true }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceSession" }
        remoteRequest:
          type: object
          nullable: true
          description: Present once a remote session of the day has been checked out of
          properties:
            id: { type: string }
            status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    DaySnapshot: { type: object, nullable: true, description: "A day as recorded; null = nothing recorded", properties: { checkIn: { type: string, format: date-time, nullable: true }, checkOut: { type: string, format: date-time, nullable: true }, workedMinutes: { type: integer } } }
    AttendanceEdit:
      type: object
      description: One audited admin change to a day (append-only)
      properties:
        id: { type: string }
        employeeId: { type: string }
        date: { type: string, format: date }
        before: { $ref: "#/components/schemas/DaySnapshot" }
        after: { $ref: "#/components/schemas/DaySnapshot" }
        reason: { type: string }
        source: { type: string, enum: [MANUAL, IMPORT] }
        createdBy: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string } } }
        createdAt: { type: string, format: date-time }
    AttendanceImportRow:
      type: object
      properties:
        line: { type: integer, description: "1-based line in the file (header is line 1)" }
        employee: { type: object, nullable: true, properties: { id: { type: string }, name: { type: string }, empCode: { type: string } } }
        date: { type: string }
        checkIn: { type: string }
        checkOut: { type: string }
        action: { type: string, enum: [create, update, unchanged, error] }
        error: { type: string }
    EmployeeProfile:
      type: object
      description: >-
        Extended profile limited to the sections the caller may see; a section the caller can't see is absent.
        Every field is null until set.
      properties:
        access:
          type: object
          properties:
            view: { type: object, properties: { personal: { type: boolean }, emergency: { type: boolean }, employment: { type: boolean }, sensitive: { type: boolean } } }
            edit: { type: object, properties: { personal: { type: boolean }, emergency: { type: boolean }, employment: { type: boolean }, sensitive: { type: boolean } } }
        data:
          type: object
          properties:
            personal:
              type: object
              description: Self, direct manager, employees.edit
              properties:
                dateOfBirth: { type: string, nullable: true, format: date }
                gender: { type: string, nullable: true, enum: [MALE, FEMALE, OTHER, UNDISCLOSED, null] }
                maritalStatus: { type: string, nullable: true, enum: [SINGLE, MARRIED, DIVORCED, WIDOWED, UNDISCLOSED, null] }
                bloodGroup: { type: string, nullable: true, enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-", null] }
                nationality: { type: string, nullable: true }
                personalEmail: { type: string, nullable: true }
                currentAddress: { type: string, nullable: true }
                permanentAddress: { type: string, nullable: true }
            emergency:
              type: object
              description: Self, direct manager, employees.edit
              properties:
                emergencyName: { type: string, nullable: true }
                emergencyRelation: { type: string, nullable: true }
                emergencyPhone: { type: string, nullable: true, description: E.164 }
            employment:
              type: object
              description: Self, direct manager, employees.edit
              properties:
                employmentType: { type: string, nullable: true, enum: [FULL_TIME, PART_TIME, CONTRACT, INTERN, CONSULTANT, null] }
                probationEndDate: { type: string, nullable: true, format: date }
                noticePeriodDays: { type: integer, nullable: true, minimum: 0, maximum: 365 }
            sensitive:
              type: object
              description: Self, employees.view_sensitive, employees.edit_sensitive
              properties:
                panNumber: { type: string, nullable: true, example: ABCDE1234F }
                aadhaarNumber: { type: string, nullable: true, description: 12 digits }
                passportNumber: { type: string, nullable: true }
                bankAccountName: { type: string, nullable: true }
                bankName: { type: string, nullable: true }
                bankAccountNumber: { type: string, nullable: true, description: 6-20 digits }
                bankIfsc: { type: string, nullable: true, example: HDFC0001234 }
    Shift:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        startTime: { type: string, example: "09:00", description: "HH:mm, org time zone" }
        endTime: { type: string, example: "18:00", description: "HH:mm; at or before startTime = overnight" }
        graceMinutes: { type: integer }
        halfDayMinutes: { type: integer, description: "Worked minutes for a half day" }
        fullDayMinutes: { type: integer, description: "Worked minutes for a full day" }
        isDefault: { type: boolean, description: "Applies to employees with no shift assigned; exactly one per org once any exist" }
        overnight: { type: boolean }
        scheduledMinutes: { type: integer }
        employeeCount: { type: integer, description: "Employees assigned explicitly (list endpoint only)" }
    OrganizationSettings:
      type: object
      properties:
        name: { type: string }
        timeZone: { type: string, example: "Asia/Kolkata" }
        weekOff: { type: string, example: "0,6", description: "Week-off pattern: comma-separated tokens, \"D\" = weekday D off every week (0 = Sunday ... 6 = Saturday), \"D#n\" = only the n-th D of the month (n 1-5). E.g. \"0,6\" = Sat + Sun, \"0,6#2,6#4\" = Sundays + 2nd and 4th Saturday, \"5,6\" = Fri + Sat, \"\" = none. Stored canonical (sorted, deduplicated); at least one weekday must stay working." }
        bannerUrl: { type: string, nullable: true }
    OfficeLocation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        radiusMeters: { type: integer }
        isOffice: { type: boolean, description: "True when a geofence (latitude/longitude) is configured" }
        timeZone: { type: string, nullable: true, description: "IANA zone for people based here; null = the organization zone" }
        weekOff: { type: string, nullable: true, example: "0,6#2,6#4", description: "Week-off pattern for people based here (see OrganizationSettings.weekOff); null = the organization's" }
    RemoteWorkRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time }
        workedMinutes: { type: integer, description: "Minutes worked remotely that day, across all remote sessions" }
        latitude: { type: number, nullable: true, description: "Where the first remote session was checked in from" }
        longitude: { type: number, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    RegularizationRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the ph_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and clear the session cookie
      responses:
        "200":
          description: Signed out

  /api/notifications:
    get:
      tags: [Notifications]
      summary: Your notifications, newest first, with your unread count
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ["true", "false"] }, description: "true = unread only" }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Notification" } }
                  unreadCount: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/daily:
    get:
      tags: [Jobs]
      summary: Run the daily jobs for every organization (scheduler only)
      description: "Called by Vercel Cron (vercel.json, weekdays 03:30 UTC = 09:00 IST). Requires `Authorization: Bearer <CRON_SECRET>`. Per organization, in order: approval escalation (requests waiting on a deactivated approver are re-routed; requests undecided for APPROVAL_ESCALATION_DAYS, default 3, move one level up the reporting line, finally to the HR queue), then the pending-approval digest (requests at least 12h old; nobody reminded twice within 20h), then attendance housekeeping: sessions still open 16h+ into a later day are closed (office: at the shift end; remote or no shift: at check-in, no time) and flagged autoClosed, and people with no check-in, leave or pending correction on their last working day get an ATTENDANCE_MISSING notification (once)."
      security: []
      parameters:
        - { name: Authorization, in: header, required: true, schema: { type: string }, description: "Bearer <CRON_SECRET>" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        organizationId: { type: string }
                        result:
                          type: object
                          properties:
                            repaired: { type: integer }
                            escalated: { type: integer }
                            reminded: { type: integer }
                            autoClosed: { type: integer }
                            missing: { type: integer, description: "ATTENDANCE_MISSING notifications sent" }
                        error: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { description: "CRON_SECRET not configured" }

  /api/notifications/read:
    post:
      tags: [Notifications]
      summary: Mark some (ids) or all of your notifications read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ids: { type: array, items: { type: string }, minItems: 1, maxItems: 200, description: "Omit to mark all read. Ids that aren't yours are ignored." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: integer }
                  unreadCount: { type: integer }
        "400": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/me:
    get:
      tags: [Auth]
      summary: Current session and employee profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
                  employee: { $ref: "#/components/schemas/EmployeeSummary" }
                  timeZone: { type: string, example: "Asia/Kolkata", description: "The signed-in person's zone (location override, else organization). Show times and compute today in it." }
                  organization:
                    type: object
                    properties:
                      bannerUrl: { type: string, nullable: true }
                      timeZone: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/organization:
    get:
      tags: [Auth]
      summary: Organization settings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
    patch:
      tags: [Auth]
      summary: Set the organization time zone (org.structure)
      description: Decides the calendar day for punches, shifts and leave and the zone times are shown in. Locations can override it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                timeZone: { type: string, example: "Asia/Kolkata", description: "IANA zone" }
                weekOff: { type: string, example: "0,6#2,6#4", description: "Week-off pattern: comma-separated tokens, \"D\" = weekday D off every week (0 = Sunday ... 6 = Saturday), \"D#n\" = only the n-th D of the month (n 1-5). E.g. \"0,6\" = Sat + Sun, \"0,6#2,6#4\" = Sundays + 2nd and 4th Saturday, \"5,6\" = Fri + Sat, \"\" = none. Stored canonical (sorted, deduplicated); at least one weekday must stay working." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OrganizationSettings" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/employees:
    get:
      tags: [Employees]
