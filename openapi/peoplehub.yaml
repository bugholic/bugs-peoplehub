          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Employees]
      summary: Deactivate an employee (admin only; soft delete)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/org-chart:
    get:
      tags: [Employees]
      summary: Flat list of active employees with their manager, for rendering an org chart
      responses:
        "200":
          description: OK

  /api/lookups:
    get:
      tags: [Employees]
      summary: Departments, designations, locations, shifts and potential managers, for form dropdowns
      responses:
        "200":
          description: OK

  /api/leave/types:
    get:
      tags: [Leave]
      summary: List active leave types
      responses:
        "200":
          description: OK
    post:
      tags: [Leave]
      summary: Create a leave type (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, annualQuota]
              properties:
                name: { type: string }
                code: { type: string }
                annualQuota: { type: number }
                paid: { type: boolean, default: true }
                carryForward: { type: boolean, default: false }
                maxCarryForward: { type: number, nullable: true, default: null, description: "Most unused days carried into the next year (multiple of 0.5); null = no cap. Only used when carryForward is true." }
                allowHalfDay: { type: boolean, default: true }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Name or code already in use" }

  /api/leave/adjustments:
    get:
      tags: [Leave]
      summary: An employee's leave balance adjustment history (defaults to self)
      parameters:
        - { name: employeeId, in: query, schema: { type: string } }
        - { name: year, in: query, schema: { type: integer } }
      responses:
        "200":
          description: OK, newest first (max 200)
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LeaveBalanceAdjustment" } }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Leave]
      summary: Credit or debit an employee's leave balance (leave.adjust_balances; not your own)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [employeeId, leaveTypeId, year, days, reason]
              properties:
                employeeId: { type: string }
                leaveTypeId: { type: string }
                year: { type: integer, description: "Up to next year." }
                days: { type: number, description: "Signed, non-zero, multiple of 0.5: positive credits, negative debits." }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveBalanceAdjustment" }
        "400": { description: "Validation failed, zero days, year too far ahead, or the grant would go below zero" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/leave/types/{id}:
    patch:
      tags: [Leave]
      summary: Edit a leave type (leave.manage_types)
      description: Carry-forward changes apply immediately (carry is computed on read). A new annualQuota also moves existing balances for this year onward by the (join-year-prorated) difference, each logged as a QUOTA_CHANGE adjustment; the response's balancesUpdated says how many.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string }
                code: { type: string }
                annualQuota: { type: number }
                paid: { type: boolean }
                carryForward: { type: boolean }
                maxCarryForward: { type: number, nullable: true }
                allowHalfDay: { type: boolean }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Name or code already in use" }

  /api/leave/balances:
    get:
      tags: [Leave]
      summary: Leave balances per type for an employee and year (defaults to self, current year)
      parameters:
        - in: query
          name: employeeId
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId: { type: string }
                  year: { type: integer }
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveBalance" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/leave/requests:
    get:
      tags: [Leave]
      summary: List leave requests
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, team, all], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveRequest" }
    post:
      tags: [Leave]
      summary: Apply for leave, with one type or combined across several
      description: |
        Send `leaveTypeId` for a single-type request. Send `parts` instead for a combined leave:
        the parts are laid over the range's working days in order (e.g. 12 days Casual, then
        3 days Earned), one LeaveRequest per part sharing a `groupId`. Combined leave is full days only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  title: Single type
                  required: [leaveTypeId, fromDate, toDate, reason]
                  properties:
                    leaveTypeId: { type: string }
                    fromDate: { type: string, format: date }
                    toDate: { type: string, format: date }
                    dayPart: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF], default: FULL }
                    reason: { type: string }
                - type: object
                  title: Combined
                  required: [parts, fromDate, toDate, reason]
                  properties:
                    fromDate: { type: string, format: date }
                    toDate: { type: string, format: date }
                    reason: { type: string }
                    parts:
                      type: array
                      minItems: 2
                      maxItems: 5
                      description: In date order; each type once; days must add up to the range's working days
                      items:
                        type: object
                        required: [leaveTypeId, days]
                        properties:
                          leaveTypeId: { type: string }
                          days: { type: integer, minimum: 1 }
      responses:
        "201":
          description: Created. A combined leave returns its group and every part.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/LeaveRequest"
                  - type: object
                    properties:
                      groupId: { type: string }
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/LeaveRequest" }
        "400": { description: "Insufficient balance (per part for combined), cross-year range, no working days, or parts that don't add up (PARTS_MISMATCH, DUPLICATE_TYPE)" }
        "409": { description: "Overlaps an existing request" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/leave/requests/preview:
    get:
      tags: [Leave]
      summary: Working days and balance a request would take, with a suggested combined split when the type doesn't cover it
      parameters:
        - { in: query, name: leaveTypeId, required: true, schema: { type: string } }
        - { in: query, name: fromDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: toDate, required: true, schema: { type: string, format: date } }
        - { in: query, name: dayPart, schema: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF], default: FULL } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  days: { type: number }
                  available: { type: number, nullable: true, description: "null for unpaid (unlimited) types" }
                  covered: { type: boolean }
                  suggestion:
                    type: object
                    nullable: true
                    description: "Chosen type first, then other paid types (most available first), then unpaid; null when covered or half day"
                    properties:
                      parts:
                        type: array
                        items:
                          type: object
                          properties:
                            leaveTypeId: { type: string }
                            days: { type: integer }
                      shortfall: { type: integer, description: "Days no balance covers (no unpaid type configured)" }
                  balances:
                    type: array
                    items:
                      type: object
                      properties:
                        leaveTypeId: { type: string }
                        name: { type: string }
                        paid: { type: boolean }
                        available: { type: number, nullable: true }
        "400": { description: "Cross-year or reversed range, half day over several dates" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/leave/requests/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Approve a leave request (the applicant's manager or an admin; never the applicant)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/leave/requests/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Reject a leave request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/leave/requests/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Cancel your own leave request (approved leave only before it starts)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { description: "Not your own request" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already started, or not cancellable" }

  /api/leave/requests/{id}/shorten:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: End approved leave early, or revoke it (also for leave that has started)
      description: >-
        Releases every leave day on or after `returnOn` (the first day back) and restores the balance; days already
        taken stay. Acts on the whole application (a combined leave is trimmed across its parts). If `returnOn` is on or
        before the first day, the whole application is cancelled. The applicant can do this to their own leave
        (returning early); a manager or HR who could approve it can do it to someone else's as a revoke (the employee
        is notified with the `note`, type LEAVE_REVOKED). `returnOn` can't be in the past.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [returnOn]
              properties:
                returnOn: { type: string, format: date }
                note: { type: string, maxLength: 500, description: "Shown to the employee on a revoke" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  freedDays: { type: number, description: "Days given back to the balance(s)" }
                  cancelled: { type: boolean, description: "Everything was released; the application is now CANCELLED" }
                  lastDay: { type: string, format: date, nullable: true, description: "Last day still on leave; null when cancelled" }
                  revoked: { type: boolean, description: "Done by someone other than the applicant" }
                  request: { $ref: "#/components/schemas/LeaveRequest" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Not approved leave (cancel a pending request instead)" }

  /api/holidays:
    get:
      tags: [Leave]
      summary: List holidays for a year
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: locationId
          schema: { type: string }
      responses:
        "200": { description: OK }
    post:
      tags: [Leave]
      summary: Add a holiday (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string }
                locationId: { type: string, nullable: true, description: "Omit for a holiday that applies to every location" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/holidays/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [Leave]
      summary: Remove a holiday (admin only)
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Start a work session (allowed again after checking out)
      description: Inside any configured office geofence the session is logged as OFFICE; otherwise, or without a location, as REMOTE.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PunchLocation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceLog" }
        "409": { description: "Already checked in (a session is open)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/attendance/check-out:
    post:
      tags: [Attendance]
      summary: End the open work session
      description: Checking out of a REMOTE session sends the day's remote work request to HR (admins), or adds the time to it. A request HR already decided goes back to PENDING when more remote time is added.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PunchLocation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceLog" }
        "409": { description: "Not checked in (no open session)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/attendance/remote-requests:
    get:
      tags: [Attendance]
      summary: List remote work requests (scope=all is admin only)
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, all], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/remote-requests/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Approve a remote work request (admin only; never your own)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/attendance/remote-requests/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Reject a remote work request (admin only; never your own)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/locations:
    get:
      tags: [Attendance]
      summary: List locations with their office geofences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OfficeLocation" }
    post:
      tags: [Attendance]
      summary: Add a location, optionally with an office geofence (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                radiusMeters: { type: integer, minimum: 20, maximum: 5000, default: 200 }
                timeZone: { type: string, nullable: true, description: "IANA zone; null = organization zone" }
                weekOff: { type: string, nullable: true, example: "0,6#2,6#4", description: "Week-off pattern (see OrganizationSettings.weekOff); null = organization pattern" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeLocation" }
        "400": { description: "Only one of latitude/longitude given" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "A location with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/locations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Attendance]
      summary: Rename a location or set or clear its office geofence (admin only)
      description: Latitude and longitude are set or cleared together; clearing them means check-ins there no longer count as office.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                radiusMeters: { type: integer, minimum: 20, maximum: 5000 }
                timeZone: { type: string, nullable: true, description: "IANA zone; null = organization zone" }
                weekOff: { type: string, nullable: true, example: "0,6#2,6#4", description: "Week-off pattern (see OrganizationSettings.weekOff); null = organization pattern" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeLocation" }
        "400": { description: "Only one of latitude/longitude given" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A location with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/shifts:
    get:
      tags: [Attendance]
      summary: List work shifts
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Shift" }
    post:
      tags: [Attendance]
      summary: Create a shift (attendance.manage_shifts)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, startTime, endTime]
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                graceMinutes: { type: integer, minimum: 0, maximum: 240, default: 15 }
                halfDayMinutes: { type: integer, minimum: 0, maximum: 1440, default: 240 }
                fullDayMinutes: { type: integer, minimum: 1, maximum: 1440, default: 480 }
                isDefault: { type: boolean, default: false, description: "The first shift is always the default" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { description: "Half-day minimum above the full-day minimum (INVALID_THRESHOLDS)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "A shift with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/shifts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Attendance]
      summary: Edit a shift or make it the default (attendance.manage_shifts)
      description: Changes apply from the next punch; days already recorded keep their figures.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                name: { type: string, maxLength: 60 }
                startTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                endTime: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                graceMinutes: { type: integer, minimum: 0, maximum: 240 }
                halfDayMinutes: { type: integer, minimum: 0, maximum: 1440 }
                fullDayMinutes: { type: integer, minimum: 1, maximum: 1440 }
                isDefault: { type: boolean, description: "Make this the default; false is rejected for the current default" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Shift" }
        "400": { description: "INVALID_THRESHOLDS, or un-defaulting the default (DEFAULT_REQUIRED)" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A shift with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Attendance]
      summary: Delete a shift; its employees fall back to the default (attendance.manage_shifts)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "The default can't be deleted while other shifts exist (DEFAULT_REQUIRED)" }

  /api/attendance:
    get:
      tags: [Attendance]
      summary: A month's attendance calendar and summary (defaults to self)
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        - in: query
          name: employeeId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId: { type: string }
                  month: { type: string }
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceDay" }
                  summary:
                    type: object
                    properties:
                      present: { type: number }
                      absent: { type: integer }
                      leave: { type: number }
                      holidays: { type: integer }
                      workedMinutes: { type: integer }
                      lateDays: { type: integer }
                      earlyExitDays: { type: integer }
                      overtimeMinutes: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/report:
    get:
      tags: [Attendance]
      summary: Team attendance summary for a month (manager or admin)
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        - in: query
          name: format
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: OK (JSON or CSV depending on `format`)
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/edits:
    get:
      tags: [Attendance]
      summary: Audit trail of admin edits and imports for an employee (newest first, up to 200)
      description: Visible to the employee and to whoever can view their attendance.
      parameters:
        - in: query
          name: employeeId
          required: true
          schema: { type: string }
        - in: query
          name: month
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceEdit" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Attendance]
      summary: Set or clear one day of someone else's attendance (attendance.edit)
      description: >-
        Setting replaces the day's sessions with one entry and recomputes shift metrics; clearing (both times null)
        deletes the day. Times are wall-clock in the employee's zone (check-out at or before check-in = next day).
        Cannot target yourself, a future date or a date before the join date; 400 NO_CHANGE when the day already matches.
        The employee is notified (ATTENDANCE_EDITED).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [employeeId, date, checkIn, checkOut, reason]
              properties:
                employeeId: { type: string }
                date: { type: string, format: date }
                checkIn: { type: string, nullable: true, example: "09:00", description: "HH:mm, or null together with checkOut to clear the day" }
                checkOut: { type: string, nullable: true, example: "18:00" }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceEdit" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/import:
    post:
      tags: [Attendance]
      summary: Import attendance from CSV (attendance.edit)
      description: >-
        CSV columns (header names are case/space insensitive): employee (code or email), date (YYYY-MM-DD),
        checkIn, checkOut (HH:mm in the employee's zone), optional reason. Up to 500 rows. `dryRun` (default true)
        validates and reports what would change without writing; with `dryRun: false` all rows are applied, or
        none if any row has an error (400 IMPORT_HAS_ERRORS). Existing days are replaced; each change is audited.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [csv]
              properties:
                csv: { type: string, maxLength: 500000 }
                dryRun: { type: boolean, default: true }
                reason: { type: string, maxLength: 500, description: "Used for rows without their own reason" }
      responses:
        "200":
          description: Preview or result
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceImportRow" }
                  summary:
                    type: object
                    properties:
                      total: { type: integer }
                      create: { type: integer }
                      update: { type: integer }
                      unchanged: { type: integer }
                      errors: { type: integer }
                  applied: { type: integer, description: "Days written; 0 for a dry run" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/regularizations:
    get:
      tags: [Attendance]
      summary: List regularization requests
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, team], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RegularizationRequest" }
    post:
      tags: [Attendance]
      summary: Request a correction to a past day's check-in/out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, checkIn, checkOut, reason]
              properties:
                date: { type: string, format: date }
                checkIn: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                checkOut: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                reason: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegularizationRequest" }
        "400": { description: "Future date or invalid times" }
        "409": { description: "Already a pending regularization for this date" }

  /api/attendance/regularizations/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Approve a regularization request and write the attendance log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/attendance/regularizations/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Reject a regularization request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/roles:
    get:
      tags: [Roles]
      summary: List custom roles and the active members they can be assigned to (org admins only)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/AccessRole" }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        empCode: { type: string }
                        name: { type: string }
                        email: { type: string }
                        photoUrl: { type: string, nullable: true }
                        designation: { type: string, nullable: true }
                        accessRoleId: { type: string, nullable: true }
                        hasLogin: { type: boolean }
                        orgRole: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE] }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Roles]
      summary: Create a role (org admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AccessRoleInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRole" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "A role with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/roles/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Roles]
      summary: Update a role's name, description or permissions (org admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                description: { type: string, nullable: true, maxLength: 200 }
                permissions:
                  type: array
                  items: { $ref: "#/components/schemas/Permission" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AccessRole" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A role with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Roles]
      summary: Delete a role; its members fall back to their org role's default permissions (org admins only)
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/employees/{id}/profile:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Employees]
      summary: Extended profile (personal, emergency, employment, identity and bank details), by section the caller may see
      description: >-
        personal / emergency / employment are visible to the employee, their direct manager and employees.edit holders.
        sensitive (PAN, Aadhaar, passport, bank) is visible only to the employee and holders of employees.view_sensitive
        or employees.edit_sensitive. 403 when the caller can see no section. `access` tells the client what to show.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeProfile" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Employees]
      summary: Update profile fields (partial; null or blank clears a field)
      description: >-
        Editable by section: personal and emergency by the employee and employees.edit; employment by employees.edit;
        sensitive only by employees.edit_sensitive (an employee cannot change their own). If any field is in a section the
        caller can't edit, nothing is written and the response is 403. PAN, Aadhaar, IFSC and similar are upper-cased and
        stripped of spaces/dashes; phone numbers are stored as E.164.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                dateOfBirth: { type: string, nullable: true, format: date }
                gender: { type: string, nullable: true, enum: [MALE, FEMALE, OTHER, UNDISCLOSED, null] }
                maritalStatus: { type: string, nullable: true, enum: [SINGLE, MARRIED, DIVORCED, WIDOWED, UNDISCLOSED, null] }
                bloodGroup: { type: string, nullable: true, enum: ["A+", "A-", "B+", "B-", "AB+", "AB-", "O+", "O-", null] }
                nationality: { type: string, nullable: true }
                personalEmail: { type: string, nullable: true }
                currentAddress: { type: string, nullable: true }
                permanentAddress: { type: string, nullable: true }
                emergencyName: { type: string, nullable: true }
                emergencyRelation: { type: string, nullable: true }
                emergencyPhone: { type: string, nullable: true, description: E.164 }
                employmentType: { type: string, nullable: true, enum: [FULL_TIME, PART_TIME, CONTRACT, INTERN, CONSULTANT, null] }
                probationEndDate: { type: string, nullable: true, format: date }
                noticePeriodDays: { type: integer, nullable: true, minimum: 0, maximum: 365 }
                panNumber: { type: string, nullable: true, example: ABCDE1234F }
                aadhaarNumber: { type: string, nullable: true, description: 12 digits }
                passportNumber: { type: string, nullable: true }
                bankAccountName: { type: string, nullable: true }
                bankName: { type: string, nullable: true }
                bankAccountNumber: { type: string, nullable: true, description: 6-20 digits }
                bankIfsc: { type: string, nullable: true, example: HDFC0001234 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeProfile" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/employees/{id}/access-role:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    put:
      tags: [Roles]
      summary: Assign a role to an employee, or null for default access (org admins only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accessRoleId]
              properties:
                accessRoleId: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  accessRoleId: { type: string, nullable: true }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
