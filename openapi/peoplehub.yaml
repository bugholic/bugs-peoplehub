openapi: 3.0.3
info:
  title: PeopleHub API
  description: Employee directory, leave and attendance for PeopleHub.
  version: "1.0.0"
servers:
  - url: http://localhost:3000
tags:
  - name: Auth
  - name: Employees
  - name: Leave
  - name: Attendance

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ph_session
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
      required: [error]
    Session:
      type: object
      properties:
        userId: { type: string }
        employeeId: { type: string }
        role: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE] }
        name: { type: string }
    Lookup:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
    EmployeeSummary:
      type: object
      properties:
        id: { type: string }
        empCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        photoUrl: { type: string, nullable: true }
        joinDate: { type: string, format: date }
        status: { type: string, enum: [ACTIVE, INACTIVE] }
        department: { $ref: "#/components/schemas/Lookup" }
        designation: { $ref: "#/components/schemas/Lookup" }
        location: { $ref: "#/components/schemas/Lookup" }
        reportingManagerId: { type: string, nullable: true }
    EmployeeCreate:
      type: object
      required: [empCode, firstName, lastName, email, joinDate]
      properties:
        empCode: { type: string }
        firstName: { type: string }
        lastName: { type: string }
        email: { type: string, format: email }
        phone: { type: string, nullable: true }
        joinDate: { type: string, format: date }
        departmentId: { type: string, nullable: true }
        designationId: { type: string, nullable: true }
        locationId: { type: string, nullable: true }
        reportingManagerId: { type: string, nullable: true }
        role: { type: string, enum: [ADMIN, MANAGER, EMPLOYEE], default: EMPLOYEE }
        password: { type: string, minLength: 8, description: "Set to create a login for this employee" }
    LeaveBalance:
      type: object
      properties:
        leaveTypeId: { type: string }
        code: { type: string }
        name: { type: string }
        paid: { type: boolean }
        granted: { type: number }
        used: { type: number }
        pending: { type: number }
        available: { type: number }
    LeaveRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        leaveType: { $ref: "#/components/schemas/Lookup" }
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        dayPart: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF] }
        days: { type: number }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    AttendanceDay:
      type: object
      properties:
        date: { type: string, format: date }
        status: { type: string, enum: [PRESENT, ABSENT, LEAVE, HALF_DAY_LEAVE, HOLIDAY, WEEKEND, UPCOMING] }
        checkIn: { type: string, format: date-time, nullable: true, description: "First check-in of the day" }
        checkOut: { type: string, format: date-time, nullable: true, description: "Last check-out of the day; null while a session is open" }
        workedMinutes: { type: integer, description: "Total of the day's closed sessions" }
        regularized: { type: boolean }
        leaveType: { type: string, nullable: true }
        workMode: { $ref: "#/components/schemas/DayWorkMode" }
        remoteStatus: { type: string, enum: [PENDING, APPROVED, REJECTED], nullable: true, description: "Status of the day's remote work request, if any" }
        openSince: { type: string, format: date-time, nullable: true, description: "Start of the open session, when checked in right now" }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceSession" }
    DayWorkMode:
      type: string
      enum: [OFFICE, REMOTE, HYBRID]
      nullable: true
      description: "OFFICE or REMOTE when every session of the day was; HYBRID when they differ"
    AttendanceSession:
      type: object
      description: One check-in to check-out stretch. A day can have several.
      properties:
        id: { type: string }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time, nullable: true, description: "null while the session is open" }
        workMode: { type: string, enum: [OFFICE, REMOTE], nullable: true, description: "Decided at check-in from the office geofences" }
        office:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
    PunchLocation:
      type: object
      description: The device's position when punching. Omit it (or send no body) if location is unavailable; the day is then logged as remote.
      required: [latitude, longitude]
      properties:
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, description: "Reported accuracy radius in metres" }
    AttendanceLog:
      type: object
      properties:
        id: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time, nullable: true, description: "First check-in of the day" }
        checkOut: { type: string, format: date-time, nullable: true, description: "Last check-out of the day; null while a session is open" }
        workedMinutes: { type: integer, description: "Total of the day's closed sessions" }
        workMode: { $ref: "#/components/schemas/DayWorkMode" }
        openSince: { type: string, format: date-time, nullable: true }
        sessions:
          type: array
          items: { $ref: "#/components/schemas/AttendanceSession" }
        remoteRequest:
          type: object
          nullable: true
          description: Present once a remote session of the day has been checked out of
          properties:
            id: { type: string }
            status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
    OfficeLocation:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        latitude: { type: number, nullable: true }
        longitude: { type: number, nullable: true }
        radiusMeters: { type: integer }
        isOffice: { type: boolean, description: "True when a geofence (latitude/longitude) is configured" }
    RemoteWorkRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time }
        workedMinutes: { type: integer, description: "Minutes worked remotely that day, across all remote sessions" }
        latitude: { type: number, nullable: true, description: "Where the first remote session was checked in from" }
        longitude: { type: number, nullable: true }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    RegularizationRequest:
      type: object
      properties:
        id: { type: string }
        employee:
          type: object
          properties:
            id: { type: string }
            name: { type: string }
            empCode: { type: string }
        date: { type: string, format: date }
        checkIn: { type: string, format: date-time }
        checkOut: { type: string, format: date-time }
        reason: { type: string }
        status: { type: string, enum: [PENDING, APPROVED, REJECTED] }
        approver:
          type: object
          nullable: true
          properties:
            id: { type: string }
            name: { type: string }
        decisionNote: { type: string, nullable: true }
        decidedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
  responses:
    Unauthorized:
      description: Not signed in
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Signed in but not allowed to perform this action
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Request failed validation
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

security:
  - sessionCookie: []

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Signed in; sets the ph_session cookie
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Sign out and clear the session cookie
      responses:
        "200":
          description: Signed out

  /api/me:
    get:
      tags: [Auth]
      summary: Current session and employee profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  session: { $ref: "#/components/schemas/Session" }
                  employee: { $ref: "#/components/schemas/EmployeeSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/employees:
    get:
      tags: [Employees]
      summary: List employees in the directory
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: departmentId
          schema: { type: string }
        - in: query
          name: locationId
          schema: { type: string }
        - in: query
          name: status
          schema: { type: string, enum: [ACTIVE, INACTIVE, ALL], default: ACTIVE }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 25 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/EmployeeSummary" }
                  total: { type: integer }
                  page: { type: integer }
                  pageSize: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [Employees]
      summary: Create an employee (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EmployeeCreate" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Email already has a login" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/employees/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Employees]
      summary: Get an employee's profile
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Employees]
      summary: Update an employee. Admins may edit any field; employees may only update their own phone number.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone: { type: string, nullable: true }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [Employees]
      summary: Deactivate an employee (admin only; soft delete)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EmployeeSummary" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/org-chart:
    get:
      tags: [Employees]
      summary: Flat list of active employees with their manager, for rendering an org chart
      responses:
        "200":
          description: OK

  /api/lookups:
    get:
      tags: [Employees]
      summary: Departments, designations, locations and potential managers, for form dropdowns
      responses:
        "200":
          description: OK

  /api/leave/types:
    get:
      tags: [Leave]
      summary: List active leave types
      responses:
        "200":
          description: OK
    post:
      tags: [Leave]
      summary: Create a leave type (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, code, annualQuota]
              properties:
                name: { type: string }
                code: { type: string }
                annualQuota: { type: number }
                paid: { type: boolean, default: true }
                carryForward: { type: boolean, default: false }
                allowHalfDay: { type: boolean, default: true }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "Name or code already in use" }

  /api/leave/balances:
    get:
      tags: [Leave]
      summary: Leave balances per type for an employee and year (defaults to self, current year)
      parameters:
        - in: query
          name: employeeId
          schema: { type: string }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId: { type: string }
                  year: { type: integer }
                  balances:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveBalance" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/leave/requests:
    get:
      tags: [Leave]
      summary: List leave requests
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, team, all], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED, CANCELLED] }
        - in: query
          name: year
          schema: { type: integer }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/LeaveRequest" }
    post:
      tags: [Leave]
      summary: Apply for leave
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [leaveTypeId, fromDate, toDate, reason]
              properties:
                leaveTypeId: { type: string }
                fromDate: { type: string, format: date }
                toDate: { type: string, format: date }
                dayPart: { type: string, enum: [FULL, FIRST_HALF, SECOND_HALF], default: FULL }
                reason: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "400": { description: "Insufficient balance, cross-year range, or no working days in range" }
        "409": { description: "Overlaps an existing request" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/leave/requests/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Approve a leave request (the applicant's manager or an admin; never the applicant)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/leave/requests/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Reject a leave request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/leave/requests/{id}/cancel:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Leave]
      summary: Cancel your own leave request (approved leave only before it starts)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LeaveRequest" }
        "403": { description: "Not your own request" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Already started, or not cancellable" }

  /api/holidays:
    get:
      tags: [Leave]
      summary: List holidays for a year
      parameters:
        - in: query
          name: year
          required: true
          schema: { type: integer }
        - in: query
          name: locationId
          schema: { type: string }
      responses:
        "200": { description: OK }
    post:
      tags: [Leave]
      summary: Add a holiday (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, name]
              properties:
                date: { type: string, format: date }
                name: { type: string }
                locationId: { type: string, nullable: true, description: "Omit for a holiday that applies to every location" }
      responses:
        "201": { description: Created }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/holidays/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    delete:
      tags: [Leave]
      summary: Remove a holiday (admin only)
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/attendance/check-in:
    post:
      tags: [Attendance]
      summary: Start a work session (allowed again after checking out)
      description: Inside any configured office geofence the session is logged as OFFICE; otherwise, or without a location, as REMOTE.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PunchLocation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceLog" }
        "409": { description: "Already checked in (a session is open)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/attendance/check-out:
    post:
      tags: [Attendance]
      summary: End the open work session
      description: Checking out of a REMOTE session sends the day's remote work request to HR (admins), or adds the time to it. A request HR already decided goes back to PENDING when more remote time is added.
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PunchLocation" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttendanceLog" }
        "409": { description: "Not checked in (no open session)" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/attendance/remote-requests:
    get:
      tags: [Attendance]
      summary: List remote work requests (scope=all is admin only)
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, all], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/remote-requests/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Approve a remote work request (admin only; never your own)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/attendance/remote-requests/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Reject a remote work request (admin only; never your own)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RemoteWorkRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/locations:
    get:
      tags: [Attendance]
      summary: List locations with their office geofences
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/OfficeLocation" }
    post:
      tags: [Attendance]
      summary: Add a location, optionally with an office geofence (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                radiusMeters: { type: integer, minimum: 20, maximum: 5000, default: 200 }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeLocation" }
        "400": { description: "Only one of latitude/longitude given" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: "A location with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/locations/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Attendance]
      summary: Rename a location or set or clear its office geofence (admin only)
      description: Latitude and longitude are set or cleared together; clearing them means check-ins there no longer count as office.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                latitude: { type: number, nullable: true }
                longitude: { type: number, nullable: true }
                radiusMeters: { type: integer, minimum: 20, maximum: 5000 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OfficeLocation" }
        "400": { description: "Only one of latitude/longitude given" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "A location with this name already exists" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /api/attendance:
    get:
      tags: [Attendance]
      summary: A month's attendance calendar and summary (defaults to self)
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        - in: query
          name: employeeId
          schema: { type: string }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  employeeId: { type: string }
                  month: { type: string }
                  days:
                    type: array
                    items: { $ref: "#/components/schemas/AttendanceDay" }
                  summary:
                    type: object
                    properties:
                      present: { type: number }
                      absent: { type: integer }
                      leave: { type: number }
                      holidays: { type: integer }
                      workedMinutes: { type: integer }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/report:
    get:
      tags: [Attendance]
      summary: Team attendance summary for a month (manager or admin)
      parameters:
        - in: query
          name: month
          required: true
          schema: { type: string, pattern: "^\\d{4}-\\d{2}$" }
        - in: query
          name: format
          schema: { type: string, enum: [json, csv], default: json }
      responses:
        "200":
          description: OK (JSON or CSV depending on `format`)
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/attendance/regularizations:
    get:
      tags: [Attendance]
      summary: List regularization requests
      parameters:
        - in: query
          name: scope
          schema: { type: string, enum: [mine, team], default: mine }
        - in: query
          name: status
          schema: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/RegularizationRequest" }
    post:
      tags: [Attendance]
      summary: Request a correction to a past day's check-in/out
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [date, checkIn, checkOut, reason]
              properties:
                date: { type: string, format: date }
                checkIn: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                checkOut: { type: string, pattern: "^([01]\\d|2[0-3]):[0-5]\\d$" }
                reason: { type: string }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegularizationRequest" }
        "400": { description: "Future date or invalid times" }
        "409": { description: "Already a pending regularization for this date" }

  /api/attendance/regularizations/{id}/approve:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Approve a regularization request and write the attendance log
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }

  /api/attendance/regularizations/{id}/reject:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Attendance]
      summary: Reject a regularization request
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                note: { type: string }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { description: "Request is no longer pending" }
